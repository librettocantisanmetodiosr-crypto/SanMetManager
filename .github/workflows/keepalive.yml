name: Supabase Keep-Alive

# Tiene "sveglio" il database Supabase per evitare la pausa
# del piano gratuito (che scatta dopo ~7 giorni di inattività).
# Fa una piccola richiesta al database ogni giorno.

on:
  schedule:
    # Ogni giorno alle 06:00 UTC (08:00 in Italia, ora legale)
    - cron: '0 6 * * *'
  # Permette anche l'avvio manuale dalla scheda "Actions" di GitHub
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping al database Supabase
        run: |
          echo "Invio richiesta di keep-alive a Supabase..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/profili?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")
          echo "Codice risposta HTTP: $HTTP_CODE"
          # 200 (ok) o 401/406 vanno bene: il database e' stato comunque
          # interrogato, quindi risulta "attivo". Falliamo solo se non
          # riusciamo proprio a contattare il server (codice 000).
          if [ "$HTTP_CODE" = "000" ]; then
            echo "ERRORE: impossibile contattare Supabase. Controlla i secret SUPABASE_URL / SUPABASE_ANON_KEY."
            exit 1
          fi
          echo "Keep-alive completato con successo."
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
